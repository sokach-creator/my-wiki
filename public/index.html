<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的百科档案馆</title>
  <link rel="stylesheet" href="/style.css">
  <!-- 资源预加载：HTML 一到就开始请求接口，不必等 JS 下载执行，高延迟线路省 1 个来回 -->
  <link rel="preload" href="/api/stats" as="fetch" crossorigin>
  <link rel="preload" href="/api/articles" as="fetch" crossorigin>
  <link rel="preload" href="/api/categories" as="fetch" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%235c1f1f'/%3E%3Cpath d='M25 30h20a8 8 0 0 1 5 2 8 8 0 0 1 5-2h20v38H55a8 8 0 0 0-5 2 8 8 0 0 0-5-2H25z M50 32v36' stroke='%23f5e9d0' stroke-width='5' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" title="返回首页">
        <svg class="brand-icon" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="18" fill="rgba(0,0,0,.25)"></rect>
          <path d="M25 30h20a8 8 0 0 1 5 2 8 8 0 0 1 5-2h20v38H55a8 8 0 0 0-5 2 8 8 0 0 0-5-2H25z M50 32v36"
                stroke="#f5e9d0" stroke-width="5" fill="none" stroke-linejoin="round"></path>
        </svg>
        <span class="brand-text">
          <strong id="siteName">我的百科档案馆</strong>
          <small id="siteTagline">记录一切 · 分享所学</small>
        </span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="#/">首页</a>
        <a href="#/list">内容列表</a>
        <a href="#/random">随机阅读</a>
        <a href="#/new" class="nav-cta">创建条目</a>
      </nav>
      <form class="header-search" id="searchForm">
        <input type="search" id="searchInput" placeholder="搜索本站…" aria-label="搜索本站">
        <button type="submit">搜索</button>
      </form>
      <button class="nav-toggle" id="navToggle" aria-label="展开菜单">☰</button>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loading">正在加载…</div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>本站由 Cloudflare Pages 驱动 · 数据存储于 Cloudflare D1 · 免注册即可编辑，请爱护内容</p>
    </div>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
